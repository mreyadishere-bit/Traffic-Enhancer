name: Validate Streamlit Community Cloud
on:
  pull_request:
    paths:
      - "streamlit_app.py"
      - "services/api/**"
      - "requirements.txt"
      - "tests/test_streamlit_cloud.py"
      - ".streamlit/**"
      - "packages.txt"
      - ".github/workflows/streamlit-cloud.yml"
  workflow_dispatch:
concurrency:
  group: streamlit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  streamlit-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install FFmpeg for full-duration video fixture
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Syntax check and Streamlit AppTest
        run: |
          python -m compileall -q streamlit_app.py
          python -m pytest -q tests/test_streamlit_cloud.py tests/test_cloud_vision.py tests/test_full_video.py tests/test_overlay_state.py tests/test_vision_routing.py tests/test_visual_retry.py
