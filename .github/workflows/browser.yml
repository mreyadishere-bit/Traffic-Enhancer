name: Evidence studio end-to-end browser tests
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install FFmpeg and runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          python -m pip install -r requirements-dev.txt
      - name: Install test browser
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Create non-incident sample video
        run: |
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i color=c=blue:s=320x180:r=5 -t 3 -c:v libx264 -pix_fmt yuv420p tests/e2e-demo.mp4
      - name: Start API for browser tests
        run: |
          TE_API_KEY=ci-private-operator-key python -m uvicorn services.api.main:app --host 127.0.0.1 --port 8000 > /tmp/traffic-ui-test.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/api/v1/health && break || sleep 1; done
      - name: Validate real user flow and capture UI
        run: node tests/web-e2e.cjs
      - name: Print API failures
        if: failure()
        run: tail -100 /tmp/traffic-ui-test.log
      - name: Save screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-studio-browser-review
          path: |
            artifacts/ui/
            /tmp/traffic-ui-test.log
          if-no-files-found: warn
